name: Check for new Meta leads and email agents

on:
  schedule:
    # Every 10 minutes. GitHub may delay this slightly under load, but it
    # will never skip a lead - it just checks everything since the last run.
    - cron: "*/10 * * * *"
  workflow_dispatch:   # lets us trigger it manually from the Actions tab
    inputs:
      backfill_since:
        description: "Backfill leads from this date (YYYY-MM-DD). Leave blank for a normal run."
        required: false
        type: string
      backfill_until:
        description: "Backfill leads until this date (YYYY-MM-DD). Leave blank for 'through now'."
        required: false
        type: string
      backfill_force:
        description: "Re-send leads even if already processed/alerted before? (true/false). Leave false unless you specifically want to re-preview old leads."
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # needed so the workflow can save state.json back to the repo

jobs:
  check-leads:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run lead check
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          ROUTING_SHEET_CSV_URL: ${{ vars.ROUTING_SHEET_CSV_URL }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FROM_NAME: ${{ vars.FROM_NAME }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          TEST_MODE: ${{ vars.TEST_MODE }}
          TEST_RECIPIENT_EMAIL: ${{ vars.TEST_RECIPIENT_EMAIL }}
          LEADS_SINCE: ${{ vars.LEADS_SINCE }}
          # Manual "Run workflow" inputs take priority (for one-off tests);
          # otherwise these fall back to the persistent repo Variables below,
          # so a backfill window set there stays active on every run -
          # including the normal 10-minute scheduled check-ins. That's what
          # lets a throttled backfill trickle out over many runs on its own.
          BACKFILL_SINCE: ${{ github.event.inputs.backfill_since || vars.BACKFILL_SINCE }}
          BACKFILL_UNTIL: ${{ github.event.inputs.backfill_until || vars.BACKFILL_UNTIL }}
          BACKFILL_FORCE: ${{ github.event.inputs.backfill_force || vars.BACKFILL_FORCE }}
          BACKFILL_MAX_PER_RUN: ${{ vars.BACKFILL_MAX_PER_RUN }}
        run: python check_leads.py

      - name: Save memory of processed leads
        run: |
          git config user.name "remax-leads-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- state.json; then
            git add state.json
            git commit -m "Update processed leads log [skip ci]"
            git push
          else
            echo "No new leads processed - nothing to commit."
          fi
